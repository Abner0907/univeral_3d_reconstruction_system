name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  OPENCV_ANDROID_VERSION: "4.10.0"
  ARCORE_VERSION: "1.47.0"
  ANDROID_NDK_VERSION: "26.1.10909125" # NDK used by Qt 6.8

jobs:
  # ---------------------------------------------------------------------------
  # Reconstruction engine (SfM + Gaussian Splatting): unit and end-to-end tests
  # ---------------------------------------------------------------------------
  engine:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopencv-dev libeigen3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DU3D_BUILD_APP=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Desktop viewer
  # ---------------------------------------------------------------------------
  viewer:
    name: Viewer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libpulse0 libva2 libva-drm2 libva-x11-2 libvdpau1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release -DU3D_WITH_SFM=OFF -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (Gaussian Splatting core)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          DESTDIR=$PWD/AppDir cmake --install build --config Release
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export QML_SOURCES_PATHS="$PWD/app/qml"
          export LDAI_OUTPUT=U3D-Viewer-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --executable AppDir/usr/bin/U3D \
            --desktop-file AppDir/usr/share/applications/u3d.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/u3d.svg
          mkdir -p dist
          mv U3D-Viewer-x86_64.AppImage dist/

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package, dist | Out-Null
          Copy-Item build/app/Release/U3D.exe package/
          windeployqt --release --no-translations --compiler-runtime --qmldir app/qml package/U3D.exe
          Compress-Archive -Path package/* -DestinationPath dist/U3D-Viewer-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: u3d-viewer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android app: capture (ARCore / camera) + on-device reconstruction + viewer
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          autodesktop: true
          cache: true

      - name: Download OpenCV Android SDK and ARCore header
        run: |
          mkdir -p deps && cd deps
          wget -q "https://github.com/opencv/opencv/releases/download/${OPENCV_ANDROID_VERSION}/opencv-${OPENCV_ANDROID_VERSION}-android-sdk.zip"
          unzip -q "opencv-${OPENCV_ANDROID_VERSION}-android-sdk.zip"
          mkdir -p arcore
          wget -q -O arcore/arcore_c_api.h \
            "https://raw.githubusercontent.com/google-ar/arcore-android-sdk/v${ARCORE_VERSION}/libraries/include/arcore_c_api.h"

      - name: Configure
        run: |
          HOST_QT="${QT_HOST_PATH:-$RUNNER_WORKSPACE/Qt/$QT_VERSION/gcc_64}"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$HOST_QT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DOpenCV_DIR="$PWD/deps/OpenCV-android-sdk/sdk/native/jni" \
            -DU3D_ARCORE_INCLUDE_DIR="$PWD/deps/arcore" \
            -DU3D_BUILD_TESTS=OFF

      - name: Build APK
        run: cmake --build build-android --target apk --parallel

      - name: Sign APK (debug key)
        run: |
          APK=$(find build-android -name '*.apk' -path '*release*' | head -n1)
          [ -n "$APK" ] || APK=$(find build-android -name '*.apk' | head -n1)
          echo "Built: $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" aligned.apk
          mkdir -p dist
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --out dist/U3D-android-arm64.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify dist/U3D-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: u3d-android
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub release for v* tags
  # ---------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine, viewer, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
